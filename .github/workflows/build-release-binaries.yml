name: Build release binaries

# Builds chess-tauri-zero-app natively on each target OS (no more
# cross-compiling Windows from Guix/mingw on the maintainer's machine)
# and updates release/chess-tauri-zero-current-* with the result. See
# release/README.md for what these files are and how to run them.
#
# bundle.active is false in tauri.conf.json, so this is a plain
# `cargo build --release`, not a `tauri build`/installer step -- the
# resulting binary reads ../web and the sidecar from the filesystem at
# launch (see release/README.md's CWD note), it does not embed them.

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "release/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: app/src-tauri
        run: cargo build --release

      - name: Rust unit tests (EngineState -- the real generation-tag race fixed 2026-08-26)
        working-directory: app/src-tauri
        run: cargo test --release

      - uses: actions/upload-artifact@v4
        with:
          name: linux-binary
          path: app/src-tauri/target/release/chess-tauri-zero-app

      # Real bug found live (repo owner hit "os error 2: file not
      # found" on Windows, independently reproduced here on Linux via
      # strace): Tauri's sidecar resolution execve()s a BARE-named
      # file (e.g. "uci-engine", no target-triple suffix) sitting
      # DIRECTLY next to the running app executable's own directory --
      # not anything in src-tauri/binaries/, regardless of naming or
      # working directory. tauri-build's build.rs already copies the
      # target-triple-matched externalBin into target/release/ under
      # that bare name as a side effect of `cargo build` -- this is
      # THAT file, confirmed via strace(execve) to be the one Tauri
      # actually runs, and release/ needs a copy of it alongside the
      # app binary for the exact same reason.
      - uses: actions/upload-artifact@v4
        with:
          name: linux-sidecar
          path: app/src-tauri/target/release/uci-engine

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build sidecar launcher (native MSVC)
        working-directory: app/uci-engine-launcher
        run: cargo build --release

      - name: Install sidecar into src-tauri/binaries
        shell: bash
        run: |
          # The crate is named uci-engine-launcher, but Cargo.toml's own
          # [[bin]] section names the binary "uci-engine" -- confirmed by
          # a real CI failure (cp: cannot stat ...-launcher.exe) before
          # this line existed.
          cp app/uci-engine-launcher/target/release/uci-engine.exe \
             app/src-tauri/binaries/uci-engine-x86_64-pc-windows-msvc.exe

      - name: Build app
        working-directory: app/src-tauri
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: windows-binary
          path: app/src-tauri/target/release/chess-tauri-zero-app.exe

      # This target-triple-named copy is only ever consulted at BUILD
      # time (tauri-build's build.rs reads it as the externalBin source
      # for the `cargo build` step above) -- committing it back into
      # src-tauri/binaries/ keeps a from-scratch build reproducible, but
      # it is never what the running app looks for. See linux-sidecar's
      # comment above for the runtime finding this mirrors on Windows.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sidecar
          path: app/src-tauri/binaries/uci-engine-x86_64-pc-windows-msvc.exe

      # THIS is the file the running app actually execve()s: the build
      # step above triggers tauri-build to copy the externalBin into
      # target/release/ under its bare command name, same mechanism as
      # linux-sidecar. release/ needs a copy of this one, not the
      # target-triple-named one above.
      - uses: actions/upload-artifact@v4
        with:
          name: windows-sidecar-bare
          path: app/src-tauri/target/release/uci-engine.exe

  test-python-and-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies (CPU torch -- correctness, not speed, is what these tests check)
        run: pip install -r requirements.txt

      - name: Python UCI protocol tests (real regression tests for 2026-08-26's live bugs)
        working-directory: src
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Frontend module-syntax check (the REAL check -- see why below)
        run: |
          # A missing closing brace in app.js broke the entire app live
          # on 2026-08-26 and went undetected all session because
          # `node --check app.js` (plain) silently passes even on a
          # real ES-module SyntaxError -- it doesn't parse in module
          # mode by default. `--input-type=module` is what actually
          # matches how index.html's `<script type="module">` (and
          # the Tauri webview) parses this file; this is the check
          # that would have caught that bug immediately.
          node --check --input-type=module < app/web/app.js

  publish-current:
    needs: [build-linux, build-windows, test-python-and-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: linux-binary
          path: dl-linux

      - uses: actions/download-artifact@v4
        with:
          name: linux-sidecar
          path: dl-linux-sidecar

      - uses: actions/download-artifact@v4
        with:
          name: windows-binary
          path: dl-windows

      - uses: actions/download-artifact@v4
        with:
          name: windows-sidecar
          path: dl-windows-sidecar

      - uses: actions/download-artifact@v4
        with:
          name: windows-sidecar-bare
          path: dl-windows-sidecar-bare

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # master can have moved since this job's own checkout (build-linux
          # + build-windows take several minutes) -- real failure seen on the
          # first run: "non-fast-forward" push rejection because a human
          # push landed on master while this job was still building.
          # release/*.exe/binary aren't tracked by anything else, so a
          # fetch+reset right before committing is safe.
          git fetch origin master
          git reset --hard origin/master
          cp dl-linux/chess-tauri-zero-app release/chess-tauri-zero-current-linux-x86_64
          chmod +x release/chess-tauri-zero-current-linux-x86_64
          cp dl-windows/chess-tauri-zero-app.exe release/chess-tauri-zero-current-windows-x86_64.exe
          # Real bug found live (repo owner hit "os error 2: file not
          # found" immediately, on every run) and root-caused via strace
          # on this Linux dev machine: Tauri's sidecar resolution
          # execve()s a BARE-named file ("uci-engine"/"uci-engine.exe",
          # no target-triple suffix) sitting DIRECTLY next to the app
          # executable's own directory -- not anything under
          # src-tauri/binaries/, and not affected by CWD (frontendDist
          # is CWD-relative, the sidecar is not -- two different
          # mechanisms). release/ never contained this bare-named file,
          # so the sidecar could never spawn no matter what else was
          # correct. These two lines are the actual fix.
          cp dl-linux-sidecar/uci-engine release/uci-engine
          chmod +x release/uci-engine
          cp dl-windows-sidecar-bare/uci-engine.exe release/uci-engine.exe
          # Target-triple-named copy: only ever consulted at BUILD time
          # (tauri-build's build.rs externalBin source) -- committed so
          # a from-scratch build stays reproducible, not because the
          # running app reads it.
          cp dl-windows-sidecar/uci-engine-x86_64-pc-windows-msvc.exe \
             app/src-tauri/binaries/uci-engine-x86_64-pc-windows-msvc.exe
          git add release/chess-tauri-zero-current-linux-x86_64 release/chess-tauri-zero-current-windows-x86_64.exe \
                  release/uci-engine release/uci-engine.exe \
                  app/src-tauri/binaries/uci-engine-x86_64-pc-windows-msvc.exe
          if git diff --cached --quiet; then
            echo "Binaries unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore(release): rebuild current binaries via CI [skip ci]"
          git push
