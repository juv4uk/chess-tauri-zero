[package]
name = "chess-tauri-zero-app"
version = "0.1.0"
description = "Tauri desktop shell for chess-tauri-zero's PyTorch AlphaZero engine, driven over UCI via a sidecar process"
edition = "2021"
build = "build.rs"

[lib]
name = "chess_tauri_zero_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
